  <link rel="stylesheet" href="style.css">

<body>

  <!-- ヘッダーエリア -->
  <header class="header">
    <div class="logo">AURORA</div>

    <!-- ハンバーガーボタン -->
    <button class="hamburger-btn" id="hamburger-btn" aria-label="メニューを開く">
      <span></span>
      <span></span>
      <span></span>
    </button>

  <!-- 背景ダミーコンテンツ（すりガラス・コントラスト確認用） -->
  <main class="content">
    <section class="hero">
      <span class="badge">NEW RELEASE</span>

    <!-- カラフルな背景カード（すりガラスの透け感確認用） -->

      <div class="card card-blue">
        <h3>HIGH RESOLUTION</h3>
        <p>圧倒的解像度で原音を忠実に再現</p>
      </div>
      <div class="card card-purple">
        <h3>NOISE CANCEL</h3>
        <p>静寂が生み出す新しい没入感</p>
      </div>
