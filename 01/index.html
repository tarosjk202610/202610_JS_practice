<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

<style>
    /* 基本のカードスタイル */
    .card {
      width: 250px;
      padding: 20px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      background-color: #ffffff;
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }

    /* JavaScriptで付与するアクティブ状態のクラス */
    .card.is-active {
      border-color: #4f46e5;
      background-color: #a059f1; /* 薄いパープル */
      transform: translateY(-4px);
    }

    .img-box {
      margin-bottom: 16px;
    }

    .img-box img {
      width: 200px;
      border-radius: 8px;
      display: block;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <h1>第1章 JavaScript基本</h1>

  <h1>DOM操作の練習</h1>

  <!-- JavaScriptで書き換える標的（ID）をセット -->
  <h2 id="product-title">商品名がここに入ります</h2>
  <p id="product-price">¥0</p>

  <h1>イベント処理</h1>
  <button id="btn">ここをクリック</button>
  <p id="message">ボタンを押すとここが変わります。</p>

  <h1>classListサンプル</h1>

  <div class="card" id="my-card">
    <h3>カード要素</h3>
    <p>ボタンを押すとデザインが変わります。</p>
  </div>

  <button id="toggle-btn">アクティブ切替 (toggle)</button>


  <h1>setAttribute / getAttribute サンプル</h1>

  <div class="img-box">
    <!-- 初期状態の画像 -->
    <img id="main-img" src="https://picsum.photos/id/634/300/200" alt="風景写真A">
    <p>現在のsrc: <span id="src-text"></span></p>
  </div>

  <button id="change-img-btn">画像を切り替える (setAttribute)</button>
  <!-- <script>
    alert('今日はいい天気です。');
  </script> -->
  <script src="main.js"></script>
</body>

</html>
