<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>3-01: 複数要素の操作 (querySelectorAll & forEach)</title>
  <script src="main.js" defer></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .card-container { display: flex; gap: 15px; }
    /* 3つのカード共通のスタイル */
    .card {
      border: 2px solid #333;
      padding: 15px;
      border-radius: 8px;
      cursor: pointer;
      width: 120px;
      text-align: center;
      transition: background-color 0.3s;
    }

    .box {
      width: 150px;
      height: 100px;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border-radius: 8px;
      margin-top: 15px;
    }

    /* アニメーション対象のカード */
    .animate-card {
      width: 200px;
      padding: 20px;
      background: #111;
      color: #fff;
      border-radius: 8px;
      text-align: center;
      /* 変化を滑らかにするCSSアニメーション設定 */
      /*transition: transform 0.5s ease, opacity 0.5s ease;*/
    }

    .btn-container { margin-bottom: 20px; display: flex; gap: 10px; }
    button { padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>複数カードの一括コントロール練習</h1>
  <p>どのカードをクリックしても反応するようにしてみよう！</p>

  <div class="card-container">
    <!-- 同じ「card」クラスを持つ3つの要素 -->
    <div class="card">カード 1</div>
    <div class="card">カード 2</div>
    <div class="card">カード 3</div>
    <div class="card">カード 3</div>
    <div class="card">カード 3</div>
    <div class="card">カード 3</div>
  </div>

  <h1>オブジェクト設定の練習</h1>
  <button id="apply-btn">設定を反映する</button>

  <div id="target-box" class="box">ターゲット</div>

  <h1>CSSプロパティ操作の練習</h1>

  <div class="btn-container">
    <button id="move-btn">右下に移動＆拡大</button>
    <button id="reset-btn">リセット</button>
  </div>

  <div id="card" class="animate-card">
    AURORA ONE
  </div>
</body>
</html>
