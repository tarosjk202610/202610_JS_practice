<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

<style>
    /* 基本のカードスタイル */
    .card {
      width: 250px;
      padding: 20px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      background-color: #ffffff;
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }

    /* JavaScriptで付与するアクティブ状態のクラス */
    .card.is-active {
      border-color: #4f46e5;
      background-color: #eeef2f1; /* 薄いパープル */
      transform: translateY(-4px);
    }
  </style>
</head>

<body>

  <h1>第1章 JavaScript基本</h1>

  <h1>DOM操作の練習</h1>

  <!-- JavaScriptで書き換える標的（ID）をセット -->
  <h2 id="product-title">商品名がここに入ります</h2>
  <p id="product-price">¥0</p>

  <h1>イベント処理</h1>
  <button id="btn">ここをクリック</button>
  <p id="message">ボタンを押すとここが変わります。</p>

  <!-- <script>
    alert('今日はいい天気です。');
  </script> -->
  <script src="main.js"></script>
</body>

</html>
